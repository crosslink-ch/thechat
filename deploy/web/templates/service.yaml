apiVersion: v1
kind: Service
metadata:
  name: {{ include "thechat-web.name" . }}
  labels:
    {{- include "thechat-web.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "thechat-web.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
