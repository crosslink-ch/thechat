worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Only successful fingerprinted Vite assets are immutable. Never cache HTML,
    # SPA fallbacks or missing assets (including across a rollback).
    map "$status:$uri" $cache_control {
        default "no-store";
        ~^200:/assets/ "public, max-age=31536000, immutable";
        ~^200:/thechat\.png$ "no-cache";
    }
    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        # TLS/HSTS is owned by the ingress. This container is HTTP-only.
        # HTTPS images/media are needed for user-authored Markdown and attachments;
        # credential-bearing connections remain limited to the API and regional S3.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' https://thechat-api.pranexa.com wss://thechat-api.pranexa.com https://*.s3.eu-central-1.amazonaws.com https://*.s3.dualstack.eu-central-1.amazonaws.com; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ /\. { return 404; }
        # Explicitly not an API proxy. Browser calls the independent API hostname.
        location = /api { return 404; }
        location /api/ { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
