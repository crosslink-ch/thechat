serviceAccount:
  name: ""
  # Annotations to add (e.g., eks.amazonaws.com/role-arn for IRSA)
  annotations: {}

replicaCount: 1

# Use the same immutable tag for image and migrateImage in production.
image:
  repository: ghcr.io/crosslink-ch/thechat-api
  tag: latest
  pullPolicy: IfNotPresent

migrateImage:
  repository: ghcr.io/crosslink-ch/thechat-api-migrate
  tag: latest
  pullPolicy: IfNotPresent

migrationJob:
  # Helm waits for this pre-install/pre-upgrade hook before changing workloads.
  activeDeadlineSeconds: 300
  backoffLimit: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Name of an existing Kubernetes Secret containing DATABASE_URL
# The secret must have a key called DATABASE_URL
databaseSecret: thechat-db

# Name of the Kubernetes Secret containing BETTER_AUTH_SECRET.
# When betterAuthInfisical.enabled=true, the Infisical operator creates and
# reconciles this Secret. Otherwise it must already exist in the namespace.
betterAuthSecret: thechat-better-auth

# Recommended production source for BETTER_AUTH_SECRET. The referenced
# Infisical path must contain a BETTER_AUTH_SECRET value with at least 32 bytes
# of high-entropy random data. The Kubernetes Secret above remains the runtime
# delivery target; it is not maintained manually when this integration is on.
betterAuthInfisical:
  enabled: false
  hostAPI: "https://eu.infisical.com/api"
  identityId: ""
  projectSlug: ""
  envSlug: "prod"
  secretsPath: "/auth"
  resyncInterval: "60s"

# Name of a Kubernetes Secret containing REDIS_URL.
# When redis.enabled=true, this chart creates the secret.
# Required when REALTIME_DRIVER=redis or BullMQ workers are enabled.
redisSecret: thechat-redis

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Name of an existing Kubernetes Secret for SMTP credentials (optional)
# Expected keys: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
# Set to "" to disable
smtpSecret: ""

# Name of an existing Kubernetes Secret for Postmark (optional)
# Expected key: POSTMARK_API_TOKEN
# Set to "" to disable
postmarkSecret: ""

env:
  NODE_ENV: "production"
  THECHAT_BACKEND_PORT: "3000"
  THECHAT_BACKEND_URL: "https://api.thechat.app"
  BETTER_AUTH_URL: "https://api.thechat.app"
  AUTH_TRUST_PROXY: "true"
  AUTH_TRUSTED_IP_HEADER: "x-real-ip"
  REALTIME_DRIVER: "redis"
  REDIS_KEY_PREFIX: "thechat"
  ASYNC_WORKER_CONCURRENCY: "4"
  EMAIL_PROVIDER: "smtp"
  EMAIL_FROM: "noreply@thechat.app"
  REQUIRE_EMAIL_VERIFICATION: "false"
  LOG_LEVEL: "info"
  ATTACHMENT_S3_BUCKET: ""
  ATTACHMENT_S3_REGION: "eu-central-1"
  ATTACHMENT_S3_FORCE_PATH_STYLE: "false"
  ATTACHMENT_UNATTACHED_TTL_SECONDS: "2592000"
  ATTACHMENT_VALIDATION_CONCURRENCY: "1"

# Static AWS credentials for attachment storage. The chart only references
# existing Secrets; it never accepts or renders credential values.
attachments:
  credentials:
    enabled: false
    api:
      # Defaults to <release-fullname>-attachments-api-aws.
      secretName: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    worker:
      # Defaults to <release-fullname>-attachments-worker-aws.
      secretName: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

  # Optional Infisical Operator synchronization for the two credential Secrets.
  # Each path must contain only AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  infisical:
    enabled: false
    hostAPI: "https://infisical.testkopie.dev/api"
    resyncInterval: "60s"
    # Kubernetes Auth machine identity used by the Infisical operator for both
    # attachment paths (in production, the shared cluster-operator identity).
    identityId: ""
    projectSlug: ""
    envSlug: "prod"
    apiSecretsPath: "/attachments/api"
    workerSecretsPath: "/attachments/worker"
    creationPolicy: "Orphan"

worker:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
    # Bind the worker-only S3 role here. Do not reuse the API role.
    annotations: {}
  command:
    - bun
    - run
    - dist/scripts/worker.js
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: 1000m

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.thechat.app
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi
    cpu: 1500m

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
