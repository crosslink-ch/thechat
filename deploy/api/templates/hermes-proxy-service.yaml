{{- if .Values.hermesProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "thechat-api.hermesProxyFullname" . }}
  labels:
    {{- include "thechat-api.hermesProxyLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "thechat-api.hermesProxySelectorLabels" . | nindent 4 }}
{{- end }}
