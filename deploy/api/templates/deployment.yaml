{{- $attachments := .Values.attachments | default dict -}}
{{- $infisical := get $attachments "infisical" | default dict -}}
{{- $betterAuthInfisical := .Values.betterAuthInfisical | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thechat-api.fullname" . }}
  labels:
    {{- include "thechat-api.labels" . | nindent 4 }}
  {{- if or (get $infisical "enabled") (get $betterAuthInfisical "enabled") }}
  annotations:
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "thechat-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thechat-api.selectorLabels" . | nindent 8 }}

    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "thechat-api.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- if .Values.hermesProxy.enabled }}
            - name: THECHAT_HERMES_PROXY_URL
              value: {{ required "hermesProxy.publicUrl is required when enabled" .Values.hermesProxy.publicUrl | quote }}
            - name: THECHAT_HERMES_PROXY_ALLOWED_ORIGINS
              value: {{ join "," .Values.hermesProxy.allowedOrigins | quote }}
            {{- end }}
            {{- include "thechat-api.env" . | trim | nindent 12 }}
            {{- include "thechat-api.apiAwsCredentialEnv" . | trim | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
