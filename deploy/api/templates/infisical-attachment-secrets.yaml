{{- $attachments := .Values.attachments | default dict -}}
{{- $credentials := get $attachments "credentials" | default dict -}}
{{- $infisical := get $attachments "infisical" | default dict -}}
{{- if get $infisical "enabled" }}
{{- if not (get $credentials "enabled") }}
{{- fail "attachments.infisical.enabled requires attachments.credentials.enabled=true" }}
{{- end }}
{{- include "thechat-api.validateAttachmentIdentityIsolation" . -}}
{{- if not .Values.worker.enabled }}
{{- fail "attachments.infisical.enabled requires worker.enabled=true" }}
{{- end }}
{{- $apiCredentials := get $credentials "api" | default dict -}}
{{- $workerCredentials := get $credentials "worker" | default dict -}}
{{- $apiAccessKeyIdKey := required "attachments.credentials.api.accessKeyIdKey is required when Infisical synchronization is enabled" (get $apiCredentials "accessKeyIdKey") -}}
{{- $apiSecretAccessKeyKey := required "attachments.credentials.api.secretAccessKeyKey is required when Infisical synchronization is enabled" (get $apiCredentials "secretAccessKeyKey") -}}
{{- $workerAccessKeyIdKey := required "attachments.credentials.worker.accessKeyIdKey is required when Infisical synchronization is enabled" (get $workerCredentials "accessKeyIdKey") -}}
{{- $workerSecretAccessKeyKey := required "attachments.credentials.worker.secretAccessKeyKey is required when Infisical synchronization is enabled" (get $workerCredentials "secretAccessKeyKey") -}}
{{- $hostAPI := required "attachments.infisical.hostAPI is required when Infisical synchronization is enabled" (get $infisical "hostAPI") -}}
{{- $identityId := required "attachments.infisical.identityId is required when Infisical synchronization is enabled" (get $infisical "identityId") -}}
{{- $projectSlug := required "attachments.infisical.projectSlug is required when Infisical synchronization is enabled" (get $infisical "projectSlug") -}}
{{- $envSlug := required "attachments.infisical.envSlug is required when Infisical synchronization is enabled" (get $infisical "envSlug") -}}
{{- $apiSecretsPath := required "attachments.infisical.apiSecretsPath is required when Infisical synchronization is enabled" (get $infisical "apiSecretsPath") -}}
{{- $workerSecretsPath := required "attachments.infisical.workerSecretsPath is required when Infisical synchronization is enabled" (get $infisical "workerSecretsPath") -}}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ printf "%s-attachments-api-infisical" (include "thechat-api.fullname" .) | trunc 253 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thechat-api.labels" . | nindent 4 }}
spec:
  hostAPI: {{ $hostAPI | quote }}
  syncConfig:
    resyncInterval: {{ get $infisical "resyncInterval" | default "60s" | quote }}
  authentication:
    kubernetesAuth:
      identityId: {{ $identityId | quote }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ include "thechat-api.serviceAccountName" . }}
        namespace: {{ .Release.Namespace }}
      secretsScope:
        projectSlug: {{ $projectSlug | quote }}
        envSlug: {{ $envSlug | quote }}
        secretsPath: {{ $apiSecretsPath | quote }}
        recursive: false
  managedKubeSecretReferences:
    - secretName: {{ include "thechat-api.attachmentApiSecretName" . }}
      secretNamespace: {{ .Release.Namespace }}
      secretType: Opaque
      creationPolicy: {{ get $infisical "creationPolicy" | default "Orphan" | quote }}
      template:
        includeAllSecrets: false
        data:
          {{ $apiAccessKeyIdKey | quote }}: {{ `{{ .AWS_ACCESS_KEY_ID.Value }}` | quote }}
          {{ $apiSecretAccessKeyKey | quote }}: {{ `{{ .AWS_SECRET_ACCESS_KEY.Value }}` | quote }}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ printf "%s-attachments-worker-infisical" (include "thechat-api.fullname" .) | trunc 253 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thechat-api.workerLabels" . | nindent 4 }}
spec:
  hostAPI: {{ $hostAPI | quote }}
  syncConfig:
    resyncInterval: {{ get $infisical "resyncInterval" | default "60s" | quote }}
  authentication:
    kubernetesAuth:
      identityId: {{ $identityId | quote }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ include "thechat-api.workerServiceAccountName" . }}
        namespace: {{ .Release.Namespace }}
      secretsScope:
        projectSlug: {{ $projectSlug | quote }}
        envSlug: {{ $envSlug | quote }}
        secretsPath: {{ $workerSecretsPath | quote }}
        recursive: false
  managedKubeSecretReferences:
    - secretName: {{ include "thechat-api.attachmentWorkerSecretName" . }}
      secretNamespace: {{ .Release.Namespace }}
      secretType: Opaque
      creationPolicy: {{ get $infisical "creationPolicy" | default "Orphan" | quote }}
      template:
        includeAllSecrets: false
        data:
          {{ $workerAccessKeyIdKey | quote }}: {{ `{{ .AWS_ACCESS_KEY_ID.Value }}` | quote }}
          {{ $workerSecretAccessKeyKey | quote }}: {{ `{{ .AWS_SECRET_ACCESS_KEY.Value }}` | quote }}
{{- end }}
