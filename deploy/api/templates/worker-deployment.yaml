{{- if .Values.worker.enabled }}
{{- $attachments := .Values.attachments | default dict -}}
{{- $infisical := get $attachments "infisical" | default dict -}}
{{- $betterAuthInfisical := .Values.betterAuthInfisical | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thechat-api.workerFullname" . }}
  labels:
    {{- include "thechat-api.workerLabels" . | nindent 4 }}
  {{- if or (get $infisical "enabled") (get $betterAuthInfisical "enabled") }}
  annotations:
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "thechat-api.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thechat-api.workerSelectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "thechat-api.workerServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "dist/scripts/worker.js"]
          env:
            {{- include "thechat-api.env" . | nindent 12 }}
            {{- include "thechat-api.workerAwsCredentialEnv" . | trim | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
