{{- $infisical := default (dict) .Values.betterAuthInfisical -}}
{{- if (get $infisical "enabled") }}
{{- $hostAPI := required "betterAuthInfisical.hostAPI is required when Infisical sync is enabled" (get $infisical "hostAPI") -}}
{{- $identityId := required "betterAuthInfisical.identityId is required when Infisical sync is enabled" (get $infisical "identityId") -}}
{{- $projectSlug := required "betterAuthInfisical.projectSlug is required when Infisical sync is enabled" (get $infisical "projectSlug") -}}
{{- $envSlug := required "betterAuthInfisical.envSlug is required when Infisical sync is enabled" (get $infisical "envSlug") -}}
{{- $secretsPath := required "betterAuthInfisical.secretsPath is required when Infisical sync is enabled" (get $infisical "secretsPath") -}}
{{- $betterAuthSecret := "thechat-better-auth" -}}
{{- if and (hasKey .Values "betterAuthSecret") (ne .Values.betterAuthSecret nil) -}}
{{- $betterAuthSecret = required "betterAuthSecret is required" .Values.betterAuthSecret -}}
{{- end }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ printf "%s-better-auth" (include "thechat-api.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "thechat-api.labels" . | nindent 4 }}
spec:
  hostAPI: {{ $hostAPI | quote }}
  resyncInterval: {{ get $infisical "resyncInterval" | default "60s" | quote }}
  authentication:
    kubernetesAuth:
      identityId: {{ $identityId | quote }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ include "thechat-api.fullname" . }}
        namespace: {{ .Release.Namespace | quote }}
  managedKubeSecretReferences:
    - secretName: {{ $betterAuthSecret | quote }}
      secretNamespace: {{ .Release.Namespace | quote }}
      creationPolicy: Orphan
      template:
        includeAllSecrets: false
        data:
          BETTER_AUTH_SECRET: '{{ "{{ .BETTER_AUTH_SECRET.Value }}" }}'
  secretsScope:
    projectSlug: {{ $projectSlug | quote }}
    envSlug: {{ $envSlug | quote }}
    secretsPath: {{ $secretsPath | quote }}
    recursive: false
{{- end }}
